<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Modell-Studio · Tobi von Nairobi</title>
    <style>
      body {
        margin: 0;
        background: #111925;
        color: #e4e9ee;
        font: 15px system-ui;
      }
      header {
        padding: 14px 26px 10px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: 0.04em;
      }
      a {
        color: #9ed8ef;
      }
      select,
      button {
        background: #253649;

      }
      canvas {
        width: 100vw;
        height: 56vh;
        display: block;
      }

        color: #aabbcc;
        margin: 6px 0;
      }
      #table {
        padding: 8px 26px 24px;
      }

      }
      th,
      td {

        border-bottom: 1px solid #253649;
        vertical-align: top;
      }
      th {
        color: #7f93a8;
        font-weight: 600;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .dim {
        color: #8b9cad;
      }

  </head>
  <body>

          <option value="girl_sexy.glb">Girl sexy</option>

    <canvas></canvas>

    <script type="module" src="./models.ts"></script>
  </body>
</html>
