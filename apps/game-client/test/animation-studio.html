<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Animation Studio · Tobi von Nairobi</title>
    <style>
      body {
        margin: 0;
        background: #111925;
        color: #e7edf4;
        font: 14px system-ui;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      aside {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 360px;
        padding: 15px;
        background: #101923e8;
        border: 1px solid #42566b;
        border-radius: 8px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      select,
      input {
        width: 100%;
        box-sizing: border-box;
      }
      pre {
        white-space: pre-wrap;
        color: #b9c9d8;
      }
      a {
        color: #8dd8f3;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <aside>
      <h1>ANIMATION / ROOT MOTION</h1>
      <a href="./models.html">Model Studio</a>
      <label
        >Character
        <select id="character"></select
      ></label>
      <label
        >Action
        <select id="action"></select
      ></label>
      <label>Speed <input id="speed" type="range" min="0" max="2" step="0.05" value="1" /></label>
      <p>Gelb: Character Root · Cyan: Hips · Magenta: Quell-Trajektorie</p>
      <pre id="state">Lade …</pre>
    </aside>
    <script type="module" src="./animation-studio.ts"></script>
  </body>
</html>
